  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* ============ HEADER ============ */
    header {
      background: rgba(10, 14, 39, 0.95);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      padding: 1.5rem 2rem;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
      min-height: auto;
    }

    .site-header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .brand {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      color: #00d4ff;
      text-decoration: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      gap: clamp(1rem, 3vw, 3.5rem);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-link {
      color: #999;
      text-decoration: none;
      font-size: clamp(12px, 2vw, 18px);
      transition: color 0.3s ease;
      cursor: pointer;
      position: relative;
      font-weight: 600;
      white-space: nowrap;
      padding: 0.25rem 0;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #00d4ff;
    }

    /* ============ MAIN LAYOUT ============ */
    .main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      gap: 2vw;
      min-height: 0;
    }

    /* LEFT SIDE - GEAR */
    .gear-section {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow: hidden;
      background: #0a0e27;
      min-height: 0;
    }

    .gear-container {
      width: clamp(200px, 35vmin, 400px);
      height: clamp(200px, 35vmin, 400px);
      position: relative;
      flex-shrink: 0;
    }

    .gear-wheel {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 50px rgba(0, 212, 255, 0.7)) drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-origin: center;
    }

    .photo-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40%;
      height: 40%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      border: clamp(6px, 2vmin, 12px) solid #00d4ff;
      box-shadow: 0 0 60px rgba(0, 212, 255, 1), inset 0 0 30px rgba(0, 212, 255, 0.6);
      background: #1a3a4a;
      z-index: 10;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 10%;
      display: block;
    }

    /* RIGHT SIDE - CONTENT */
