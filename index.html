<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Srikanth Reddy Eppa — Mechatronics Engineer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* ============ HEADER ============ */
    header {
      background: rgba(10, 14, 39, 0.95);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      padding: 1.5rem 2rem;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
      min-height: auto;
    }

    .site-header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .brand {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      color: #00d4ff;
      text-decoration: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      gap: clamp(1rem, 3vw, 3.5rem);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-link {
      color: #999;
      text-decoration: none;
      font-size: clamp(12px, 2vw, 18px);
      transition: color 0.3s ease;
      cursor: pointer;
      position: relative;
      font-weight: 600;
      white-space: nowrap;
      padding: 0.25rem 0;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #00d4ff;
    }

    /* ============ MAIN LAYOUT ============ */
    .main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      gap: 2vw;
      min-height: 0;
    }

    /* LEFT SIDE - GEAR */
    .gear-section {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow: hidden;
      background: #0a0e27;
      min-height: 0;
    }

    .gear-container {
      width: clamp(200px, 35vmin, 400px);
      height: clamp(200px, 35vmin, 400px);
      position: relative;
      flex-shrink: 0;
    }

    .gear-wheel {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 50px rgba(0, 212, 255, 0.7)) drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-origin: center;
    }

    .photo-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40%;
      height: 40%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      border: clamp(6px, 2vmin, 12px) solid #00d4ff;
      box-shadow: 0 0 60px rgba(0, 212, 255, 1), inset 0 0 30px rgba(0, 212, 255, 0.6);
      background: #1a3a4a;
      z-index: 10;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 10%;
      display: block;
    }

    /* RIGHT SIDE - CONTENT */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0e27;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .content-section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transform: translateX(40px);
      transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.6s ease;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      overflow: hidden;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      padding-top: clamp(1.5rem, 3vw, 2.5rem);
    }

    .content-section.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      pointer-events: auto;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .content-section::-webkit-scrollbar {
      width: 6px;
    }

    .content-section::-webkit-scrollbar-track {
      background: rgba(0, 212, 255, 0.05);
    }

    .content-section::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 3px;
    }

    .content-section::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.5);
    }

    .section-title {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 800;
      color: #00d4ff;
      margin-bottom: clamp(1.5rem, 4vw, 3rem);
      letter-spacing: 0.3px;
      text-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ============ ABOUT SECTION ============ */
    .about-content {
      display: flex;
      flex-direction: column;
      gap: clamp(1.5rem, 3vw, 2rem);
      min-height: 0;
      flex-shrink: 0;
    }

    .about-text {
      font-size: clamp(13px, 1.8vw, 16px);
      line-height: 1.9;
      color: #d0d0d0;
      text-align: left;
      letter-spacing: 0.3px;
      margin: 0;
      flex-shrink: 0;
    }

    .about-meta {
      margin-top: 0;
      font-size: clamp(11px, 1.4vw, 14px);
      color: #00d4ff;
      flex-shrink: 0;
      order: 3;
    }

    .meta-location {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .portfolio-subheading {
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 700;
      color: #00d4ff;
      margin-top: clamp(1.5rem, 3vw, 2rem);
      margin-bottom: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.3px;
    }

    .portfolio-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(0.75rem, 1.5vw, 1.25rem);
      margin-bottom: clamp(0.5rem, 1vw, 1rem);
    }

    .portfolio-btn {
      padding: clamp(0.6rem, 1.2vw, 0.85rem) clamp(1.2rem, 2.5vw, 1.8rem);
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.6);
      background: rgba(0, 212, 255, 0.08);
      color: #00d4ff;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .portfolio-btn i {
      font-size: 0.9em;
    }

    .portfolio-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }

    .portfolio-btn.primary-btn {
      background: linear-gradient(135deg, #00d4ff, #00a8ff);
      color: #0a0e27;
      border-color: transparent;
      box-shadow: 0 4px 25px rgba(0, 212, 255, 0.4);
    }

    .portfolio-btn.primary-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 40px rgba(0, 212, 255, 0.6);
    }

    .portfolio-btn.ghost-btn {
      background: transparent;
      border-style: dashed;
      border-width: 1.5px;
      border-color: rgba(0, 212, 255, 0.5);
      color: #c0e7ff;
    }

    .highlight-pills {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(0.4rem, 1vw, 0.8rem);
      margin-top: clamp(1rem, 2vw, 1.5rem);
      flex-shrink: 0;
    }

    .highlight-pill {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.4);
      font-size: clamp(9px, 1.2vw, 12px);
      font-weight: 500;
      color: #c0e7ff;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .highlight-pill i {
      font-size: 0.8em;
      color: #00d4ff;
    }

    .skills-section {
      margin-top: clamp(1.25rem, 2.5vw, 1.75rem);
      flex-shrink: 0;
    }

    .skills-title {
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.85rem;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: clamp(0.7rem, 1.6vw, 1.2rem);
    }

    .skills-category {
      background: linear-gradient(145deg, rgba(10, 14, 39, 0.95), rgba(26, 31, 58, 0.95));
      border-radius: 16px;
      padding: 0.9rem 1.1rem;
      border: 1px solid rgba(0, 212, 255, 0.22);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .skills-category::before {
      content: '';
      position: absolute;
      inset: -80%;
      background: radial-gradient(circle at top, rgba(0, 212, 255, 0.14), transparent 60%);
      opacity: 0.7;
      pointer-events: none;
    }

    .skills-category-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .skills-category-title span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }

    .skills-category-title i {
      color: #00d4ff;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      position: relative;
      z-index: 1;
    }

    .skills-tag {
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 11px;
      color: #a9d9ff;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.35);
      white-space: nowrap;
    }

    /* ============ EXPERIENCE SECTION ============ */
    .experience-layout {
      display: flex;
      gap: clamp(1.75rem, 3vw, 2.5rem);
      align-items: flex-start;
      min-height: 0;
      margin-right: 0.75rem;
    }

    .experience-left-column {
      width: clamp(235px, 28vw, 320px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .experience-right-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .experience-card {
      background: radial-gradient(circle at top left, rgba(0, 212, 255, 0.13), rgba(10, 14, 39, 0.98));
      border-radius: 22px;
      padding: 1.2rem 1.1rem 1.15rem;
      border: 1px solid rgba(0, 212, 255, 0.28);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      position: relative;
      overflow: hidden;
    }

    .experience-card-header {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
      position: relative;
      z-index: 1;
    }

    .experience-card-title {
      font-size: 15px;
      font-weight: 700;
      color: #00d4ff;
      letter-spacing: 0.03em;
    }

    .experience-role {
      font-size: 13px;
      color: #c0e7ff;
      opacity: 0.88;
    }

    .experience-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 11px;
      color: #9fb5cc;
      opacity: 0.9;
      margin-top: 0.15rem;
    }

    .meta-divider {
      opacity: 0.4;
    }

    .experience-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.1rem;
      position: relative;
      z-index: 1;
    }

    .experience-tag {
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.38);
      background: rgba(4, 39, 70, 0.8);
      font-size: 10px;
      color: #9bd5ff;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 600;
    }

    .experience-body {
      margin-top: 0.85rem;
      position: relative;
    }

    .experience-description {
      font-size: 12px;
      color: #c4d5e6;
      line-height: 1.8;
      margin-bottom: 0.7rem;
      position: relative;
      z-index: 1;
    }

    .experience-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      position: relative;
      z-index: 1;
      gap: 0.5rem;
    }

    .experience-footer-left {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .experience-id-pill {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(12, 74, 110, 0.7);
      border: 1px solid rgba(0, 212, 255, 0.35);
      font-size: 10px;
      color: #e0f2fe;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 600;
    }

    .experience-btn {
      padding: 0.6rem 0.8rem;
      border-radius: 999px;
      background: rgba(9, 24, 44, 0.85);
      border: 1px solid rgba(0, 212, 255, 0.35);
      color: #bfdbfe;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .experience-btn i {
      font-size: 0.8rem;
      color: #38bdf8;
    }

    .experience-btn:hover {
      background: rgba(12, 74, 110, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(56, 189, 248, 0.45);
    }

    .experience-card .experience-btn.primary-action {
      background: linear-gradient(135deg, #00d4ff, #38bdf8);
      color: #0b1120;
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.7);
    }

    .experience-card .experience-btn.primary-action i {
      color: #0b1120;
    }

    .experience-card .experience-btn.secondary-action {
      background: rgba(15, 23, 42, 0.95);
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
    }

    .experience-card .experience-btn.secondary-action i {
      color: #9ca3af;
    }

    .experience-card .experience-btn.secondary-action:hover {
      background: rgba(30, 64, 175, 0.9);
      border-style: solid;
      border-color: rgba(59, 130, 246, 0.9);
      color: #eff6ff;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.7);
    }

    .experience-scroll-msg {
      margin-top: 1rem;
      font-size: 11px;
      color: rgba(148, 163, 184, 0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .experience-scroll-msg i {
      color: #38bdf8;
    }

    /* Special image treatments for soft robot experience */
    .experience-card-header.soft-robot-header {
      background-image: url('files/soft-robot/Soft_Robot_HighRes.png');
      background-size: cover;
      background-position: center;
      border-radius: 18px;
      padding: 1rem;
      margin: -1.2rem -1.1rem 0.9rem;
      box-shadow: inset 0 -40px 60px rgba(15, 23, 42, 0.9);
      position: relative;
      overflow: hidden;
    }

    .experience-card-header.soft-robot-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.05), rgba(15, 23, 42, 0.9));
      z-index: 0;
    }

    .experience-card-header.soft-robot-header > * {
      position: relative;
      z-index: 1;
    }

    .experience-body.soft-robot-tasks {
      background-image: url('files/soft-robot/Full_Assembly.png');
      background-size: cover;
      background-position: center;
      border-radius: 18px;
      padding: 1.05rem 1rem 0.9rem;
      margin: 0 -0.1rem;
      position: relative;
      overflow: hidden;
    }

    .experience-body.soft-robot-tasks::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.96));
      z-index: 0;
    }

    .experience-body.soft-robot-tasks > * {
      position: relative;
      z-index: 1;
    }

    .experience-card.soft-robot-card::before {
      content: '';
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at top, rgba(0, 212, 255, 0.3), transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .experience-card.soft-robot-card > * {
      position: relative;
      z-index: 1;
    }

    .experience-body .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      background: rgba(15, 23, 42, 0.85);
      gap: 0.35rem;
      margin-bottom: 0.55rem;
    }

    .experience-body .pill i {
      color: #38bdf8;
      font-size: 0.75rem;
    }

    .experience-skills-heading {
      font-size: 11px;
      color: #e5e7eb;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 0.5rem;
      opacity: 0.85;
    }

    .experience-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.6rem;
    }

    .experience-skills-list span {
      font-size: 10px;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #cbd5f5;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    /* ============ EXPERIENCE CAROUSEL ============ */
    .experience-carousel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .experience-carousel-inner {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .experience-item {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .experience-item.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .experience-main-card {
      background: radial-gradient(circle at top left, rgba(0, 212, 255, 0.1), rgba(10, 14, 39, 0.98));
      border-radius: 22px;
      padding: 1.3rem 1.2rem 1.2rem;
      border: 1px solid rgba(0, 212, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      position: relative;
      overflow: hidden;
    }

    .experience-main-header {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .experience-main-title-box {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .experience-main-title {
      font-size: 18px;
      font-weight: 700;
      color: #e0f2fe;
      letter-spacing: 0.02em;
    }

    .experience-main-subtitle {
      font-size: 13px;
      color: #9fb5cc;
    }

    .experience-meta-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
    }

    .experience-location-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 11px;
      color: #cbd5f5;
    }

    .experience-location-pill i {
      font-size: 0.8rem;
      color: #38bdf8;
    }

    .experience-employment-type {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .experience-main-details {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.4fr);
      gap: 1.1rem;
      align-items: flex-start;
    }

    .experience-description-block {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .experience-description-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .experience-description-pill {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.8);
      background: rgba(15, 23, 42, 0.92);
      font-size: 10px;
      color: #e0f2fe;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .experience-description-pill i {
      font-size: 0.75rem;

    /* ============ EXPERIENCE MODALS & TABS ============ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .experience-modal {
      width: min(960px, 94vw);
      max-height: min(600px, 90vh);
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(12px);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      position: relative;
    }

    .modal-backdrop.active .experience-modal {
      opacity: 1;
      transform: translateY(0);
    }

    }

    .projects-side-title {

    }

    .projects-side-badge {

    .projects-side-list i {

    /* ============ GALLERY MODAL ============ */
    .gallery-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 250;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .gallery-modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .gallery-modal {
      width: min(1100px, 96vw);
      height: min(620px, 92vh);
      border-radius: 22px;
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.45), rgba(15, 23, 42, 0.95));

      flex-direction: column;
      position: relative;
      transform: translateY(12px);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .gallery-modal-backdrop.active .gallery-modal {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .gallery-modal-title-block {

      flex-direction: column;
      gap: 0.15rem;
    }

    .gallery-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #e0f2fe;
      letter-spacing: 0.02em;
    }

    .gallery-modal-subtitle {
      font-size: 12px;
      color: #cbd5f5;
    }

    .gallery-modal-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 11px;
      color: #9ca3af;
      gap: 0.25rem;
    }

    .gallery-modal-meta-main {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.8);
      color: #cbd5f5;
    }

    .gallery-modal-meta-main i {
      font-size: 0.8rem;
      color: #38bdf8;
    }

    .gallery-modal-close {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 2;
    }

    .gallery-modal-close i {
      font-size: 0.9rem;
    }

    .gallery-modal-close:hover {
      background: rgba(220, 38, 38, 0.92);
      border-color: rgba(248, 113, 113, 0.95);
      color: #fef2f2;
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(248, 113, 113, 0.7);
    }

    .gallery-modal-body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 0.8rem;
      margin-top: 0.35rem;
      min-height: 0;
    }

    .gallery-main-view {
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.85);
      background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .gallery-main-image-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      position: relative;
    }

    .gallery-main-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: none;
      display: block;
    }

    .gallery-main-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-top: 1px solid rgba(51, 65, 85, 0.9);
      background: rgba(15, 23, 42, 0.98);
      font-size: 11px;
      color: #9ca3af;
    }

    .gallery-main-nav-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .gallery-main-nav-left i {
      font-size: 0.85rem;
      color: #38bdf8;
    }

    .gallery-main-nav-right {
      display: flex;
      gap: 0.4rem;
    }

    .gallery-main-btn {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .gallery-main-btn:hover {
      background: rgba(30, 64, 175, 0.9);
      border-color: rgba(59, 130, 246, 0.95);
      color: #eff6ff;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(59, 130, 246, 0.65);
    }

    .gallery-thumbs-panel {
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: radial-gradient(circle at top right, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
      padding: 0.6rem 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
    }

    .gallery-thumbs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #9ca3af;
    }

    .gallery-thumbs-header strong {
      color: #e5e7eb;
    }

    .gallery-thumbs-header i {
      font-size: 0.8rem;
      color: #38bdf8;
    }

    .gallery-thumbs-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.5rem;
    }

    .gallery-thumbs-grid::-webkit-scrollbar {
      width: 6px;
    }

    .gallery-thumbs-grid::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.95);
    }

    .gallery-thumbs-grid::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.7);
      border-radius: 3px;
    }

    .gallery-thumb {
      border-radius: 12px;
      border: 1px solid rgba(51, 65, 85, 0.9);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0.9;
    }

    .gallery-thumb::after {
      content: attr(data-label);
      position: absolute;
      left: 0.4rem;
      bottom: 0.35rem;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.8);
      font-size: 10px;
      color: #e5e7eb;
      max-width: calc(100% - 0.8rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-thumb:hover img {
      transform: scale(1.05);
      opacity: 1;
    }

    .gallery-thumb.active {
      border-color: rgba(56, 189, 248, 0.9);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.85);
    }

    .gallery-thumb-badge {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(59, 130, 246, 0.9);
      font-size: 9px;
      color: #dbeafe;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .gallery-thumb-badge i {
      font-size: 0.7rem;
      color: #38bdf8;
    }

    .gallery-video-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.75);
    }

    .gallery-video-badge i {
      font-size: 1rem;
    }

    .gallery-caption-bar {
      margin-top: 0.55rem;
      padding: 0.45rem 0.6rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.8);
      font-size: 11px;
      color: #cbd5f5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .gallery-caption-bar i {
      font-size: 0.85rem;
      color: #38bdf8;
    }

    .gallery-caption-highlight {
      font-weight: 600;
      color: #e0f2fe;
    }

    /* ============ SOCIAL & FOOTER ============ */
    .footer {
      background: radial-gradient(circle at top, rgba(0, 212, 255, 0.12), rgba(4, 7, 24, 0.98));
      padding: 0.55rem 2rem 0.7rem;
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .footer-left i {
      color: #38bdf8;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .social-links {
      display: flex;
      gap: 0.4rem;
    }

    .social-link {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.25s ease;
      background: rgba(15, 23, 42, 0.95);
    }

    .social-link:hover {
      background: rgba(59, 130, 246, 0.95);
      border-color: rgba(129, 140, 248, 0.9);
      box-shadow: 0 8px 22px rgba(59, 130, 246, 0.7);
      transform: translateY(-1px);
    }

    .footer-tagline {
      font-size: 10px;
      color: #9ca3af;
      margin-left: 0.35rem;
    }

    /* ============ RESPONSIVE DESIGN ============ */
    @media (max-width: 1024px) {
      .main-wrapper {
        flex-direction: column;
        gap: 1rem;
      }

      .gear-section {
        order: 1;
        padding-bottom: 0.5rem;
      }

      .content-wrapper {
        order: 2;
        height: calc(100vh - 360px);
      }

      .experience-layout,
      .projects-layout {
        flex-direction: column;
      }

      .experience-left-column,
      .experience-right-column,
      .projects-layout {
        width: 100%;
      }

      .projects-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .experience-modal-body {
        flex-direction: column;
      }

      .experience-modal-tabs {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(148, 163, 184, 0.55);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .experience-modal-tab {
        flex: 1;
      }

      .experience-modal-content-wrapper {
        padding: 0.5rem 0.7rem 0.7rem;
      }

      .gallery-modal-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .gallery-main-view {
        min-height: 260px;
      }

      .content-section {
        padding: 1.6rem 1.4rem 1.8rem;
      }

      .section-title {
        margin-bottom: 1.4rem;
      }

      .footer {
        padding: 0.5rem 1.2rem;
        font-size: 10px;
      }

      .footer-right {
        gap: 0.4rem;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 1.2rem 1.25rem 1.1rem;
      }

      .site-header-inner {
        gap: 1rem;
      }

      .main-wrapper {
        gap: 0.85rem;
      }

      .gear-section {
        padding-top: 0.75rem;
        padding-bottom: 0.25rem;
      }

      .gear-container {
        width: clamp(180px, 42vw, 260px);
        height: clamp(180px, 42vw, 260px);
      }

      .content-wrapper {
        height: auto;
      }

      .content-section {
        position: relative;
        transform: none;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        height: auto;
        max-height: unset;
      }

      .content-section:not(.active) {
        display: none;
      }

      .section-title {
        font-size: clamp(26px, 7.5vw, 34px);
        margin-bottom: 1.2rem;
      }

      .experience-layout {
        margin-right: 0;
      }

      .experience-main-details {
        grid-template-columns: minmax(0, 1fr);
      }

      .experience-main-meta {
        align-items: flex-start;
      }

      .experience-main-tech {
        justify-content: flex-start;
      }

      .experience-main-actions {
        flex-direction: column;
        align-items: flex-start;
      }

      .experience-main-actions-right {
        justify-content: flex-start;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.3rem;
      }
    }

    @media (max-width: 480px) {
      header {
        padding: 1rem 1rem 0.9rem;
      }

      .nav-center {
        gap: 0.8rem;
      }

      .content-section {
        padding: 1.3rem 1rem 1.5rem;
      }

      .portfolio-buttons {
        flex-direction: column;
      }

      .experience-main-card {
        padding: 1.1rem 1rem 1rem;
      }

      .experience-main-header {
        flex-direction: column;
      }

      .experience-main-meta {
        align-items: flex-start;
      }

      .experience-modal {
        width: 96vw;
        border-radius: 18px;
      }

      .experience-modal-header {
        padding-right: 2.4rem;
      }

      .experience-modal-body {
        flex-direction: column;
      }

      .experience-modal-tabs {
        flex-direction: row;
        flex-wrap: wrap;
        padding: 0.75rem 0.7rem 0.6rem;
      }

      .experience-modal-tab strong {
        font-size: 10px;
      }

      .experience-modal-content-wrapper {
        padding: 0.5rem 0.6rem 0.6rem;
      }

      .gallery-modal {
        width: 96vw;
        padding: 0.85rem 0.85rem;
      }

      .gallery-modal-body {
        gap: 0.65rem;
        grid-template-columns: minmax(0, 1fr);
      }

      .gallery-main-view {
        min-height: 220px;
      }

      .gallery-thumbs-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }

      .footer {
        padding: 0.45rem 0.9rem 0.7rem;
      }
    }
  </style>
</head>

        <div class="about-content">

            I am a Mechatronics Engineer with a strong foundation in robotics, mechanical design, control systems, and…
