<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Srikanth Reddy Eppa — Mechatronics Engineer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* ============ HEADER ============ */
    header {
      background: rgba(10, 14, 39, 0.95);
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      padding: 1.5rem 2rem;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
      min-height: auto;
    }

    .site-header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 100%;
      flex-wrap: wrap;
    }

    .brand {
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 700;
      color: #00d4ff;
      text-decoration: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      gap: clamp(1rem, 3vw, 3.5rem);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-link {
      color: #999;
      text-decoration: none;
      font-size: clamp(12px, 2vw, 18px);
      transition: color 0.3s ease;
      cursor: pointer;
      position: relative;
      font-weight: 600;
      white-space: nowrap;
      padding: 0.25rem 0;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #00d4ff;
    }

    /* ============ MAIN LAYOUT ============ */
    .main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
      gap: 2vw;
      min-height: 0;
    }

    /* LEFT SIDE - GEAR */
    .gear-section {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow: hidden;
      background: #0a0e27;
      min-height: 0;
    }

    .gear-container {
      width: clamp(200px, 35vmin, 400px);
      height: clamp(200px, 35vmin, 400px);
      position: relative;
      flex-shrink: 0;
    }

    .gear-wheel {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 50px rgba(0, 212, 255, 0.7)) drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform-origin: center;
    }

    .photo-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40%;
      height: 40%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      overflow: hidden;
      border: clamp(6px, 2vmin, 12px) solid #00d4ff;
      box-shadow: 0 0 60px rgba(0, 212, 255, 1), inset 0 0 30px rgba(0, 212, 255, 0.6);
      background: #1a3a4a;
      z-index: 10;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 10%;
      display: block;
    }

    /* RIGHT SIDE - CONTENT */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0e27;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .content-section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transform: translateX(40px);
      transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.6s ease;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      overflow: hidden;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      padding-top: clamp(1.5rem, 3vw, 2.5rem);
    }

    .content-section.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      pointer-events: auto;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .content-section::-webkit-scrollbar {
      width: 6px;
    }

    .content-section::-webkit-scrollbar-track {
      background: rgba(0, 212, 255, 0.05);
    }

    .content-section::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 3px;
    }

    .content-section::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.5);
    }

    .section-title {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 800;
      color: #00d4ff;
      margin-bottom: clamp(1.5rem, 4vw, 3rem);
      letter-spacing: 0.3px;
      text-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* ============ ABOUT SECTION ============ */
    .about-content {
      display: flex;
      flex-direction: column;
      gap: clamp(1.5rem, 3vw, 2rem);
      min-height: 0;
      flex-shrink: 0;
    }

    .about-text {
      font-size: clamp(13px, 1.8vw, 16px);
      line-height: 1.9;
      color: #d0d0d0;
      text-align: left;
      letter-spacing: 0.3px;
      margin: 0;
      flex-shrink: 0;
    }

    .about-meta {
      margin-top: 0;
      font-size: clamp(11px, 1.4vw, 14px);
      color: #00d4ff;
      flex-shrink: 0;
      order: 3;
    }

    .meta-location {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .portfolio-subheading {
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 700;
      color: #00d4ff;
      margin-top: clamp(1.5rem, 3vw, 2rem);
      margin-bottom: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.3px;
    }

    .portfolio-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(0.75rem, 1.5vw, 1.25rem);
      margin-bottom: clamp(0.5rem, 1vw, 1rem);
    }

    .portfolio-btn {
      padding: clamp(0.6rem, 1.2vw, 0.85rem) clamp(1.2rem, 2.5vw, 1.8rem);
      border-radius: 999px;
      border: 1px solid rgba(0, 212, 255, 0.6);
      background: rgba(0, 212, 255, 0.08);
      color: #00d4ff;
      font-size: clamp(11px, 1.5vw, 13px);
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .portfolio-btn:hover {
      background: #00d4ff;
      color: #0a0e27;
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.7);
      transform: translateY(-1px);
    }

    .portfolio-btn i {
      font-size: 0.9em;
    }

    .social-links {
      display: flex;
      gap: clamp(1rem, 2.5vw, 2rem);
      margin-top: clamp(0.75rem, 1.5vw, 1.5rem);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .social-links a {
      width: clamp(40px, 8vw, 56px);
      height: clamp(40px, 8vw, 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #00d4ff;
      border-radius: 50%;
      color: #00d4ff;
      text-decoration: none;
      font-size: clamp(16px, 3vw, 24px);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .social-links a:hover {
      background: #00d4ff;
      color: #0a0e27;
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.7);
    }

    /* ============ HORIZONTAL TIMELINE (without journey line) ============ */
    .timeline-wrapper {
      width: 100%;
      margin-bottom: clamp(1rem, 2vw, 1.5rem);
      flex-shrink: 0;
    }

    .horizontal-timeline {
      display: flex;
      gap: clamp(1.25rem, 2.5vw, 2rem);
      overflow-x: auto;
      overflow-y: hidden;
      padding: clamp(1.5rem, 2.5vw, 2rem) 0 1rem 0;
      scroll-behavior: smooth;
      flex-shrink: 0;
    }

    .horizontal-timeline::-webkit-scrollbar {
      height: 8px;
    }

    .horizontal-timeline::-webkit-scrollbar-track {
      background: rgba(0, 212, 255, 0.05);
      border-radius: 4px;
      margin: 0 10px;
    }

    .horizontal-timeline::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.4);
      border-radius: 4px;
      border: 2px solid rgba(0, 212, 255, 0.1);
    }

    .horizontal-timeline::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.6);
    }

    .timeline-card {
      flex: 0 0 clamp(300px, 40vw, 420px);
      padding: clamp(1.25rem, 2.5vw, 1.75rem);
      background: rgba(0, 212, 255, 0.04);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 10px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: clamp(0.75rem, 1.5vw, 1.25rem);
      position: relative;
      padding-bottom: clamp(85px, 18vw, 120px);
    }

    .timeline-card:hover {
      background: rgba(0, 212, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.15);
      transform: translateY(-5px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: clamp(0.75rem, 1.5vw, 1.25rem);
      flex-wrap: wrap;
    }

    .card-logo {
      width: clamp(35px, 5vw, 50px);
      height: clamp(35px, 5vw, 50px);
      border-radius: 8px;
      background: rgba(0, 212, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(0, 212, 255, 0.2);
      font-size: clamp(14px, 2.5vw, 20px);
      color: #00d4ff;
    }

    .card-header-content {
      flex: 1;
      min-width: 0;
    }

    .card-job-title {
      font-size: clamp(13px, 2vw, 17px);
      font-weight: 700;
      color: #00d4ff;
      margin: 0 0 0.25rem 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.3;
      text-align: left;
    }

    .card-company {
      font-size: clamp(11px, 1.6vw, 14px);
      color: #d0d0d0;
      margin: 0;
    }

    .card-popup-btn {
      width: clamp(32px, 4vw, 42px);
      height: clamp(32px, 4vw, 42px);
      border: 2px solid rgba(0, 212, 255, 0.5);
      background: rgba(0, 212, 255, 0.05);
      color: #00d4ff;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 2vw, 18px);
      transition: all 0.3s ease;
      flex-shrink: 0;
      padding: 0;
    }

    .card-popup-btn:hover {
      background: rgba(0, 212, 255, 0.15);
      border-color: #00d4ff;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
      transform: scale(1.1);
    }

    .card-location-date {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: clamp(10px, 1.4vw, 12px);
      color: #999;
    }

    .card-location {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-date {
      font-weight: 500;
      color: #00d4ff;
    }

    .card-skills {
      padding: clamp(0.75rem, 1.5vw, 1.25rem);
      background: rgba(0, 50, 68, 0.3);
      border-radius: 6px;
      border-left: 3px solid #00d4ff;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }

    .card-skills-title {
      font-size: clamp(10px, 1.3vw, 12px);
      color: #00d4ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0;
      text-align: left;
    }

    .card-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0;
    }

    .skill-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.35rem, 0.7vw, 0.5rem) clamp(0.5rem, 1vw, 0.75rem);
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 4px;
      font-size: clamp(9px, 1.2vw, 11px);
      color: #00d4ff;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .skill-tag:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: rgba(0, 212, 255, 0.4);
      box-shadow: 0 2px 8px rgba(0, 212, 255, 0.15);
    }

    .card-footer-logo {
      position: absolute;
      bottom: clamp(0.5rem, 1vw, 0.75rem);
      right: clamp(0.5rem, 1vw, 0.75rem);
      width: clamp(70px, 15vw, 110px);
      height: clamp(70px, 15vw, 110px);
      border-radius: 8px;

      border: 1.5px solid rgba(0, 212, 255, 0.3);
